# Bitcoin Core demo config for MrDocs.
#
# Scope: the whole of Bitcoin Core's own C++ API under src/ (~281 headers).
# Excluded from the docs:
#   - vendored third-party bundled under src/ (leveldb, crc32c, secp256k1,
#     minisketch, univalue) - not Bitcoin's own API; kept on the include path
#     only so Bitcoin's headers that use them still parse.
#   - build/GUI/IPC/test trees (qt, ipc, interfaces, test, bench).
#   - 34 top-level headers (wallet/, rpc/, node/, txmempool, validation, ...)
#     that are not self-contained: they use std:: types without including the
#     std header, or reference boost.multi_index tags declared in a header that
#     is only included transitively by the .cpp that uses them. MrDocs parses
#     each header as its own translation unit, so these fail to parse in
#     isolation. Recovering them cleanly needs a compilation database
#     (compile_commands.json) built from Bitcoin's CMake, which needs its full
#     dependency set (Boost, libevent). Listed individually below.
source-root: ..
input: [ ../src ]
includes:
  - ../src
  - ../src/univalue/include
  - ../src/leveldb/include
  - ../src/crc32c/include
  - ../src/secp256k1/include
  - ../src/minisketch/include
  - shims
  # Placed before the bundled libc++ (which arrives on `-isystem`) so the
  # stdlib override under stdlib-shims/__algorithm/ shadows the stock header.
  # See stdlib-shims/__algorithm/unwrap_range.h for why.
  - stdlib-shims
file-patterns: [ '*.h' ]

# Toolchain isolation.
#
# MrDocs bundles a matching libc++ 23 and clang 23 resource dir; turning off
# use-system-stdlib makes MrDocs use them and add -nostdinc++ so the host's
# C++ stdlib cannot leak onto the include path (a version skew between the
# clang 23 frontend and the host's libc++ headers is what made 23
# prevector-dependent headers fail here). The system C library stays on:
# Bitcoin needs the full POSIX surface (sys/time.h, arpa/inet.h + the network
# stack, sys/wait.h, ...), which the bundled libc-stubs set does not provide,
# and MrDocs discovers the host's libc dirs from the system compiler on any
# platform.
use-system-stdlib: false
use-system-libc: true
missing-include-prefixes: [ 'event2/', 'zmq', 'sqlite3', 'db_cxx', 'gmp', 'mp/', 'kj/', 'capnp/' ]
implementation-defined: [ '**::detail', '**::internal' ]
exclude-patterns:
  - ../src/leveldb/**
  - ../src/crc32c/**
  - ../src/secp256k1/**
  - ../src/minisketch/**
  - ../src/univalue/**
  - ../src/crypto/ctaes/**
  - ../src/test/**
  - ../src/bench/**
  - ../src/qt/**
  - ../src/ipc/**
  - ../src/interfaces/**
  - ../src/**/test/**
  - ../src/chainparamsseeds.h
  # The 23 headers that used to sit here all transitively include prevector.h,
  # whose <algorithm> use triggered the libc++ std::pair CTAD ambiguity. The
  # toolchain isolation above (bundled libc++ 23 + macOS SDK C headers) plus the
  # stdlib-shims/__algorithm/unwrap_range.h override recovered 22 of them; they
  # now parse and are no longer excluded.
  #
  # The three below stay excluded because they have their own self-containment
  # gaps that are unrelated to prevector/CTAD (a compile_commands.json from
  # Bitcoin's CMake would be the clean way to recover them):
  #   - rpc/protocol.h: uses std:: without including the relevant std header
  #     ("use of undeclared identifier 'std'").
  #   - addrman_impl.h: references AddressPosition, whose type is only visible
  #     through a transitive include ("unexpected namespace name 'AddressPosition'").
  #   - wallet/external_signer_scriptpubkeyman.h: uses ExternalSigner without
  #     including <external_signer.h>, so MrDocs shims the name and it collides
  #     ("redefinition of 'ExternalSigner' as different kind of symbol"). Adding
  #     the missing include makes it parse.
  - ../src/rpc/protocol.h
  - ../src/addrman_impl.h
  - ../src/wallet/external_signer_scriptpubkeyman.h
