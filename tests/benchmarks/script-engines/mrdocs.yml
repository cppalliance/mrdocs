# The script engine benchmarks run over MrDocs's own corpus, the same
# input as docs/mrdocs.yml, and no generator, so the timing is the scripts' own.
# run.py adds the addon root of the bench transform, lua/ or js/, to each run:
# the two scripts have the same name, so one run loads only one of them.
source-root: ../../..
input:
  - ../../../include
  - ../../../libs/dom/include
  - ../../../libs/handlebars/include
  - ../../../libs/polyfill/include
file-patterns:
  - '*.hpp'
include-symbols:
  - 'mrdocs::**'
exclude-symbols:
  - 'mrdocs::*Finalizer'
exclude-macros:
  - 'MRDOCS_*'
  - 'INFO'
  - 'LOG'
  - 'F'
  - 'FMT_CONSTEVAL'
implementation-defined:
  - '**::detail'
  - '**mrdocs_*_descriptor_fn'
multipage: false
generator: noop
warn-if-undocumented: false
cmake: '-D MRDOCS_MRDOCS_BUILD=ON'
