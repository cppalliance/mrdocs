# $schema: https://mrdocs.com/docs/mrdocs/develop/_attachments/schemas/config/mrdocs.schema.json
# yaml-language-server: $schema=https://mrdocs.com/docs/mrdocs/develop/_attachments/schemas/config/mrdocs.schema.json

verbose: true
# The `mrdocs` addon (docs/mrdocs/extensions/) provides the script-driven
# `schema` generator used to reflect the DOM schema from MrDocs's own types.
# It is inert for the default adoc build and active when run with `--generator=schema`.
addons-supplemental:
  - mrdocs
source-root: ..
input:
  - ../include
  - ../libs/dom/include
  - ../libs/handlebars/include
  - ../libs/polyfill/include
file-patterns:
  - '*.hpp'
include-symbols:
  - 'mrdocs::**'
include-macros:
  - 'MRDOCS_PLUGIN_*'
implementation-defined:
  - '**::detail'
    # Injected by the MRDOCS_DESCRIBE_* macros
  - '**mrdocs_*_descriptor_fn'
multipage: true
generator: adoc
cmake: '-D MRDOCS_MRDOCS_BUILD=ON'

