# $schema: ./mrdocs.schema.json
# yaml-language-server: $schema=./mrdocs.schema.json

verbose: true
source-root: ..
input:
  - ../include
file-patterns:
  - '*.hpp'
include-symbols:
  - 'mrdocs::**'
implementation-defined:
  - '**::detail'
    # Injected by the MRDOCS_DESCRIBE_* macros
  - '**mrdocs_*_descriptor_fn'
multipage: true
generator: adoc
cmake: '-D MRDOCS_DOCUMENTATION_BUILD=ON'

