# $schema: ./mrdocs.schema.json
# yaml-language-server: $schema=./mrdocs.schema.json

verbose: true
source-root: ..
input:
  - ../include
file-patterns:
  - '*.hpp'
include-symbols:
  - 'mrdocs::**'
implementation-defined:
  - 'mrdocs::detail'
  - 'mrdocs::report::detail'
  - 'mrdocs::dom::detail'
exclude-symbols:
    # Reflection facilities.
  - 'mrdocs::describe'
  - 'mrdocs::describe::**'
    # Symbols injected by MRDOCS_DESCRIBE_STRUCT, etc.
  - '**mrdocs_base_descriptor_fn'
  - '**mrdocs_member_descriptor_fn'
  - '**mrdocs_enum_descriptor_fn'
  - '**mrdocs_kind_descriptor_fn'
multipage: true
generator: adoc
cmake: '-D MRDOCS_DOCUMENTATION_BUILD=ON'

