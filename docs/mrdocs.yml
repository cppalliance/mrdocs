# $schema: https://mrdocs.com/docs/mrdocs/develop/_attachments/schemas/config/mrdocs.schema.json
# yaml-language-server: $schema=https://mrdocs.com/docs/mrdocs/develop/_attachments/schemas/config/mrdocs.schema.json

verbose: true
# The `mrdocs` addon (docs/mrdocs/extensions/) provides the script-driven
# `schema` generator used to reflect the DOM schema from MrDocs's own types.
# It is inert for the default adoc build and active when run with `--generator=schema`.
addons-supplemental:
  - mrdocs
source-root: ..
input:
  - ../include
  - ../libs/dom/include
  - ../libs/handlebars/include
  - ../libs/polyfill/include
file-patterns:
  - '*.hpp'
include-symbols:
  - 'mrdocs::**'
# The corpus finalizers live in src/ and reach the reference only through the
# friend-class grants in Corpus.hpp, so they surface as empty internal records
# with nowhere to attach documentation. They are maintainer-facing, not public
# API, so keep them out of MrDocs's own reference.
exclude-symbols:
  - 'mrdocs::*Finalizer'
# The documented MRDOCS_* macros (MRDOCS_TRY, MRDOCS_CHECK, MRDOCS_CHECK_OR,
# MRDOCS_ASSERT, MRDOCS_DESCRIBE_*, ...) are public API. Private helpers are
# named MRDOCS_DETAIL_* or MRDOCS_PP_* and excluded by pattern, so a stray doc
# comment can't publish them. With extract-all-macros off, the undocumented
# build plumbing (MRDOCS_DECL, MRDOCS_VISIBLE, ...) stays out as well, and
# include-macros keeps out the X-macros (INFO, LOG, F) and compat shims.
include-macros:
  - 'MRDOCS_*'
exclude-macros:
  - 'MRDOCS_DETAIL_*'
  - 'MRDOCS_PP_*'
implementation-defined:
  - '**::detail'
    # Injected by the MRDOCS_DESCRIBE_* macros
  - '**mrdocs_*_descriptor_fn'
multipage: true
generator: adoc
cmake: '-D MRDOCS_MRDOCS_BUILD=ON'

