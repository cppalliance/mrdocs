# npm install
# npx antora --fetch antora-playbook.yml
site:
  title: Mr.Docs
  url: https://www.mrdocs.com/
  start_page: develop@mrdocs::index.adoc
  robots: allow
  keys:
    repo_url: 'https://github.com/cppalliance/mrdocs'

content:
  # "HEAD" for author mode, [ develop, master ] for published versions.
  # Pass `--attribute tagsarray=` (empty) on the CLI to skip tagged
  # versions entirely, which is handy when iterating on HEAD.
  branches: ${branchesarray}
  tags: ${tagsarray}
  edit_url: 'https://github.com/cppalliance/mrdocs/edit/{refname}/{path}'
  sources:
    # The component URL is relative to the playbook file, since the only component
    # is hosted on the same repository as the playbook.
    # This allows the same playbook to be used for author mode with the
    # "HEAD" branch.
    - url: ..
      start_path: docs
      edit_url: 'https://github.com/cppalliance/mrdocs/edit/{refname}/{path}'
      worktrees: true

ui:
  bundle:
    url: './ui/build/ui-bundle.zip'
    snapshot: true

antora:
  extensions:
    - require: '@alandefreitas/antora-playbook-macros-extension'
      macros:
        branchesarray: [ develop, master ]
        tagsarray: [ v* ]
    - require: '@sntke/antora-mermaid-extension' # <1>
      mermaid_library_url: https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs # <2>
      script_stem: header-scripts
      mermaid_initialize_options:
        start_on_load: true
        theme: base
        theme_variables:
          font_family: '"Roboto", sans-serif'
          quadrant1_fill: 'transparent'
          quadrant2_fill: 'transparent'
          quadrant3_fill: 'transparent'
          quadrant4_fill: 'transparent'
          quadrant_point_fill: '#9eb1ff'
          quadrant_point_text_fill: '#ffffff'
          quadrant_title_fill: '#ffffff'
          quadrant_x_axis_text_fill: '#ffffff'
          quadrant_y_axis_text_fill: '#ffffff'
          quadrant_internal_border_stroke_fill: '#ffffff44'
          quadrant_external_border_stroke_fill: '#ffffff88'
    - require: '@antora/lunr-extension' # https://gitlab.com/antora/antora-lunr-extension
      index_latest_only: true
    - require: '@cppalliance/antora-cpp-reference-extension'
      auto-base-url: true
      breadcrumbs: true
    - require: '@cppalliance/antora-cpp-tagfiles-extension'
      cpp-tagfiles:
        using-namespaces:
          - mrdocs
    - require: ./extensions/repo-snippets-extension.js
      mounts:
        - source: test-files/golden-tests/snippets
          target: snippets
          strip_page_wrapper: true
        - source: examples/generators/data-driven
          target: data-driven-generators
        - source: examples/generators/script-driven
          target: script-driven-generators
        - source: examples
          target: examples
    - require: ./extensions/commands-registry-extension.js
    - require: ./extensions/adoc-preview-extension.js

asciidoc:
  attributes:
    logo-img: ''
    logo-text: 'Mr. Docs'
    icon-img: ''
    # Render LaTeX math. `stem:[...]` and `[stem]` blocks become MathJax
    # delimiters (\(...\) inline, \[...\] display); the UI head loads
    # MathJax to typeset them. MrDocs's own `$...$` / `\f$...\f$` doc-comment
    # math emits `stem:[...]`, so this lights up the generated reference too.
    stem: latexmath
    # Make every `[tabs]` block in the docs a synchronised tabset.
    # A tab click in one tabset selects the matching label in every
    # other tabset on the page, and the choice is persisted in
    # localStorage under the key the UI sets via
    # `data-sync-storage-key` on `tabs.js`. The pages exercise this
    # for JS / Lua snippet pairs.
    #
    # `tabs-sync-option` is Asciidoctor's convention for setting a
    # document-level option; the @asciidoctor/tabs extension reads
    # it via `doc.option?('tabs-sync')`.
    tabs-sync-option@: ''
  extensions:
    - '@asciidoctor/tabs'
    - ./extensions/mrdocs-demos.js
    - ./extensions/mrdocs-releases.js
    - ./extensions/config-options-reference.js
