name: Utility Tests

on:
  workflow_call:
    inputs:
      coverage-replay:
        description: 'when true, re-upload develop coverage to codecov instead of running a Coverage build'
        type: boolean
        default: false
      merge-base-sha:
        description: 'merge-base SHA used to locate the matching coverage-develop artifact'
        type: string
        default: ''

jobs:
  utility-tests:
    runs-on: ubuntu-24.04
    name: Utility Tests
    permissions:
      contents: read
      actions: read

    steps:
      - name: Clone MrDocs
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bootstrap Python Tests
        run: |
          set -eux
          pip install --quiet coverage
          python3 -m coverage run -m unittest discover -s util/bootstrap/tests/
          python3 -m coverage report
          python3 -m coverage report --fail-under=84
          python3 -m coverage xml -o bootstrap-coverage.xml

      - name: Upload Bootstrap Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: bootstrap-coverage.xml
          flags: bootstrap
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Danger.js Tests
        working-directory: util/danger
        run: |
          npm ci --ignore-scripts
          npx vitest run

      - name: Check YAML schema
        run: |
          python3 ./util/generate-yaml-schema.py --check
          npx -y -p ajv-cli -- ajv compile -s docs/mrdocs.schema.json

      - name: Verify snippet .cpp files match golden tests
        run: .github/scripts/verify-snippets.sh

      # When the Coverage matrix entry was skipped because the develop cache is
      # warm, fetch develop's LCOV report and re-upload it tagged with the PR's
      # commit SHA. Codecov sees zero patch lines and unchanged project totals,
      # so codecov/patch and codecov/project post passing statuses without us
      # rebuilding the whole project just to remeasure unchanged coverage.
      - name: Coverage replay (fetch develop LCOV)
        if: inputs.coverage-replay
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_BASE: ${{ inputs.merge-base-sha }}
        run: |
          set -euo pipefail
          artifact_id=$(gh api -X GET "/repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f name=coverage-develop -f per_page=100 \
            --jq '.artifacts[] | select(.expired == false and .workflow_run.head_sha == "'"$MERGE_BASE"'") | .id' \
            | head -n1)
          if [[ -z "${artifact_id:-}" ]]; then
            echo "::error::coverage-develop artifact disappeared between probe and replay"
            exit 1
          fi
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > coverage.zip
          unzip -o coverage.zip -d coverage-develop
          lcov_path=$(find coverage-develop -maxdepth 3 -name '*.info' -print -quit)
          if [[ -z "${lcov_path:-}" ]]; then
            echo "::error::no LCOV file found inside coverage-develop artifact"
            exit 1
          fi
          echo "LCOV_PATH=$lcov_path" >> "$GITHUB_ENV"

      - name: Coverage replay (upload to codecov)
        if: inputs.coverage-replay
        uses: codecov/codecov-action@v7
        with:
          files: ${{ env.LCOV_PATH }}
          flags: cpp
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
