name: Utility Tests

on:
  workflow_call:
    inputs:
      coverage-replay:
        description: 'when true, re-upload develop coverage to codecov instead of running a Coverage build'
        type: boolean
        default: false
      merge-base-sha:
        description: 'merge-base SHA used to locate the matching coverage-develop artifact'
        type: string
        default: ''

jobs:
  utility-tests:
    runs-on: ubuntu-24.04
    name: Utility Tests
    permissions:
      contents: read
      actions: read

    steps:
      - name: Clone MrDocs
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # One command runs every guard that needs no build: the layout, the
      # README and page lengths, the section titles, the header guard and
      # include spelling on the changed lines, the generated YAML schema and bootstrap options, the
      # commands registry and the two JSON schemas compiled with ajv. A pull
      # request or a merge queue entry is judged against its base; a push,
      # against the commit before it (or the parent, on a new branch). The
      # reflected generator schemas are kept up to date by the `schema-check`
      # ctest, and the RELAX NG one is exercised by the `xml-lint` ctest.
      # It runs before the coverage steps, whose bootstrap-coverage.xml,
      # coverage.xml and codecov files the layout guard would flag.
      - name: Lint
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eux
          base="${PR_BASE_SHA:-${MERGE_GROUP_BASE_SHA:-}}"
          if [ -z "$base" ]; then
            base="${PUSH_BEFORE_SHA:-}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=HEAD~1
          fi
          python3 -I utils/lint/lint.py --base "$base"

      - name: Bootstrap Python Tests
        run: |
          set -eux
          pip install --quiet coverage
          python3 -m coverage run --rcfile=utils/bootstrap/pyproject.toml -m unittest discover -s utils/bootstrap/tests/
          python3 -m coverage report --rcfile=utils/bootstrap/pyproject.toml
          python3 -m coverage report --rcfile=utils/bootstrap/pyproject.toml --fail-under=84
          python3 -m coverage xml --rcfile=utils/bootstrap/pyproject.toml -o bootstrap-coverage.xml

      - name: Upload Bootstrap Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: bootstrap-coverage.xml
          flags: bootstrap
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Danger.js Tests
        working-directory: utils/danger
        run: |
          npm ci --ignore-scripts
          npx vitest run

      # The Linux release check runs on a binary that is supposed to pass.
      # This shows each of its rejections firing, on stub objdump listings.
      - name: Check Linux portability script
        run: .github/scripts/linux-portability/test-check-linux-portability.sh --transcripts .github/scripts/linux-portability/transcripts

      # The format tests run clang-format. .clang-format uses options that need
      # clang-format 20 or later (ReflowComments: Always), and Ubuntu 24.04
      # ships 18.
      - name: Install clang-format
        run: |
          set -eux
          pipx install 'clang-format>=21,<22'
          clang-format --version

      # The unit tests of the linters in utils/lint.
      - name: Check lint unit tests
        run: python3 -I -m unittest discover -s utils/lint/tests -t utils/lint

      # The unit tests of the formatter in utils/format.
      - name: Check format unit tests
        run: python3 -I -m unittest discover -s utils/format/tests -t utils/format

      # The unit tests of the code generators in utils/codegen.
      - name: Check codegen unit tests
        run: python3 -I -m unittest discover -s utils/codegen/tests -t utils/codegen

      # The unit tests of the docs tooling in utils/docs.
      - name: Check docs tooling unit tests
        run: python3 -I -m unittest discover -s utils/docs/tests -t utils/docs

      # When the Coverage matrix entry was skipped because the develop cache is
      # warm, fetch develop's LCOV report and re-upload it tagged with the PR's
      # commit SHA. Codecov sees zero patch lines and unchanged project totals,
      # so codecov/patch and codecov/project post passing statuses without us
      # rebuilding the whole project just to remeasure unchanged coverage.
      - name: Coverage replay (fetch develop LCOV)
        if: inputs.coverage-replay
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_BASE: ${{ inputs.merge-base-sha }}
        run: |
          set -euo pipefail
          artifact_id=$(gh api -X GET "/repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f name=coverage-develop -f per_page=100 \
            --jq '.artifacts[] | select(.expired == false and .workflow_run.head_sha == "'"$MERGE_BASE"'") | .id' \
            | head -n1)
          if [[ -z "${artifact_id:-}" ]]; then
            echo "::error::coverage-develop artifact disappeared between probe and replay"
            exit 1
          fi
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > coverage.zip
          unzip -o coverage.zip -d coverage-develop
          lcov_path=$(find coverage-develop -maxdepth 3 -name '*.info' -print -quit)
          if [[ -z "${lcov_path:-}" ]]; then
            echo "::error::no LCOV file found inside coverage-develop artifact"
            exit 1
          fi
          echo "LCOV_PATH=$lcov_path" >> "$GITHUB_ENV"

      - name: Coverage replay (upload to codecov)
        if: inputs.coverage-replay
        uses: codecov/codecov-action@v7
        with:
          files: ${{ env.LCOV_PATH }}
          flags: cpp
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
