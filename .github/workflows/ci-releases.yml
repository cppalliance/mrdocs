# Official repository: https://github.com/cppalliance/mrdocs
#
# Per-OS smoke validation of the produced mrdocs binary plus demo
# generation against vendored third-party projects. Runs on every PR
# (always required) so the `Releases / Linux/Windows/macOS` status
# checks always reflect an end-to-end install + run of the binary.

name: Releases

on:
  workflow_call:
    inputs:
      submatrix:
        description: 'JSON-encoded releases submatrix from cpp-matrix'
        type: string
        required: true
      use-develop-binaries:
        description: 'true to fetch packages from develop-release instead of this run'
        type: boolean
        default: false

jobs:
  releases:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.submatrix) }}

    defaults:
      run:
        shell: bash

    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    permissions:
      contents: read
    steps:
      - name: Container Bootstrap
        uses: alandefreitas/cpp-actions/container-bootstrap@v1.9.5

      # Adds the apt source that publishes the release GCC for ubuntu:20.04, so that Setup C++ finds it.
      - name: Add The Release GCC Source
        if: ${{ matrix.container == 'ubuntu:20.04' }}
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl
          mkdir -p /etc/apt/keyrings
          curl -fsSL 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x60C317803A41BA51845E371A1E9377A2BA9EF27F' \
            -o /etc/apt/keyrings/ubuntu-toolchain-r-test.asc
          echo 'deb [signed-by=/etc/apt/keyrings/ubuntu-toolchain-r-test.asc] https://ppa.launchpadcontent.net/ubuntu-toolchain-r/test/ubuntu focal main' \
            > /etc/apt/sources.list.d/ubuntu-toolchain-r-test.list

      - name: Setup C++
        uses: alandefreitas/cpp-actions/setup-cpp@v1.9.5
        id: setup-cpp
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}

      - name: Install packages
        uses: alandefreitas/cpp-actions/package-install@v1.9.5
        with:
          apt-get: build-essential asciidoctor cmake ninja-build bzip2 git rsync jq

      - name: Clone MrDocs
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Fetch the nearest release tag
        # A push build labels itself with the nearest calendar tag, which a depth-1 clone lacks.
        if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}
        uses: ./.github/actions/fetch-release-tag

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Ninja
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v6

      # ubuntu:20.04 has Python 3.8, and the scripts need 3.9.
      - name: Setup Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
          activate-environment: true
          enable-cache: false

      - name: Setup CMake
        uses: alandefreitas/cpp-actions/setup-cmake@v1.9.5
        with:
          version: '>=3.26'

      # When use-develop-binaries=false the package comes from this run's
      # ci-build artifact. When true we pull the matching platform asset
      # from the rolling develop-release; the scope-detector only sets
      # this when it verified the cache is warm.
      - name: Download MrDocs package (fresh build)
        if: ${{ !inputs.use-develop-binaries }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.mrdocs-release-package-artifact }}
          path: packages

      - name: Download MrDocs package (develop-release fallback)
        if: ${{ inputs.use-develop-binaries }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p packages
          case "${{ runner.os }}" in
            Linux)   pattern='*Linux*' ;;
            Windows) pattern='*Windows*' ;;
            macOS)   pattern='*Darwin*' ;;
            *) echo "::error::unknown runner.os: ${{ runner.os }}"; exit 1 ;;
          esac
          gh release download develop-release --pattern "$pattern" -D packages

      - name: Install MrDocs from Package
        run: .github/scripts/install-mrdocs-package.sh

      # Checks the Linux package against the manylinux policy (see
      # utils/cmake/release-linux.cmake): glibc symbols at or below the floor,
      # RUNPATH $ORIGIN/../lib, and no needed library but glibc, the bundled
      # libstdc++ and libgcc_s. The fix for a failure is in the package, not
      # in the floor.
      - name: Check Linux Portability
        # A package reused from develop-release was checked by the run that
        # published it.
        if: ${{ runner.os == 'Linux' && !inputs.use-develop-binaries }}
        run: .github/scripts/linux-portability/check-linux-portability.sh "$MRDOCS_ROOT/bin/mrdocs"

      # Reads the minimum macOS of the executable (LC_BUILD_VERSION, `minos`)
      # and compares it with the deployment target set in ci-build.yml
      # (matrix.macos-deployment-target). It fails first when that target is
      # empty, since there is then nothing to compare with.
      - name: Check macOS Minimum Version
        # A package reused from develop-release was checked by the run that
        # published it.
        if: ${{ runner.os == 'macOS' && !inputs.use-develop-binaries }}
        env:
          EXPECTED_MINOS: ${{ matrix.macos-deployment-target }}
        run: |
          if [ -z "$EXPECTED_MINOS" ]; then
            echo "::error::matrix.macos-deployment-target is empty, so the minimum macOS of bin/mrdocs cannot be checked"
            exit 1
          fi
          minos=$(otool -l "$MRDOCS_ROOT/bin/mrdocs" | awk '$1 == "minos" { print $2; exit }')
          echo "minos of bin/mrdocs: ${minos:-none}"
          if [ "$minos" != "$EXPECTED_MINOS" ]; then
            echo "::error::bin/mrdocs has a minimum macOS of '${minos:-none}', expected $EXPECTED_MINOS"
            exit 1
          fi

      # Builds the consumer plugin with the compiler of the job (GCC 15 in the
      # release container on Linux) and loads it into the package.
      - name: CMake Consumer Test (release package)
        uses: alandefreitas/cpp-actions/cmake-workflow@v1.9.5
        with:
          cmake-version: '>=3.26'
          source-dir: tests/integration/cmake
          build-dir: build/cmake-consumer
          cxxstd: ${{ matrix.cxxstd }}
          cc: ${{ steps.setup-cpp.outputs.cc || matrix.cc }}
          cxx: ${{ steps.setup-cpp.outputs.cxx || matrix.cxx }}
          generator: Ninja
          build-type: ${{ matrix.build-type }}
          # mrdocs_ROOT, rather than CMAKE_PREFIX_PATH, is the package-specific
          # find_package hint. install-mrdocs-package.sh exports MRDOCS_PREFIX
          # in its CMake-valid form. On macOS the deployment target is the one
          # the docs tell plugin authors to use.
          extra-args: -D mrdocs_ROOT=${{ env.MRDOCS_PREFIX }} ${{ matrix.macos-deployment-target != '' && format('-D CMAKE_OSX_DEPLOYMENT_TARGET={0}', matrix.macos-deployment-target) || '' }}
          run-tests: true
          install: false

      # The demos exist to be published, not to test anything: the copies that
      # reach the website come from Linux. macOS stays because it is fast (it
      # finishes before Linux, so it never blocks the job). Windows generation
      # takes hours on the large demos and validates nothing extra, so every
      # demo step is skipped there.
      - name: Clone Boost.URL
        if: runner.os != 'Windows'
        uses: alandefreitas/cpp-actions/boost-clone@v1.9.5
        with:
          branch: develop
          modules: url
          boost-dir: boost
          modules-scan-paths: '"test example"'
          modules-exclude-paths: ''
          trace-commands: true

      # Boost.URL (above) needs the Boost superproject, and Mr.Docs is this very
      # checkout, so both are handled on their own. Every other demo project is
      # driven from examples/third-party/projects.json (see the script).
      - name: Clone Demo Projects
        if: runner.os != 'Windows'
        run: .github/scripts/clone-demo-projects.sh

      # Generates the demos with mrdocs.
      - name: Generate Demos
        if: runner.os != 'Windows'
        env:
          # The CMake that mrdocs starts reads CC and CXX.
          CC: ${{ steps.setup-cpp.outputs.cc || matrix.cc }}
          CXX: ${{ steps.setup-cpp.outputs.cxx || matrix.cxx }}
        run: .github/scripts/generate-demos.sh

      - name: Upload Demos as Artifacts
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: demos${{ (contains(fromJSON('["master", "develop"]'), github.ref_name) && format('-{0}', github.ref_name)) || '' }}-${{ runner.os }}
          path: demos.tar.gz
          retention-days: ${{ contains(fromJSON('["master", "develop"]'), github.ref_name) && '30' || '1' }}
