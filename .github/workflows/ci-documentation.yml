# Official repository: https://github.com/cppalliance/mrdocs
#
# Per-OS validation that the docs/website/Antora-UI pipelines build
# cleanly with the installed mrdocs binary. Scope-gated: runs when
# source, docs, build, or third-party files changed (i.e. anything
# that can influence rendered documentation). Skipped on tooling /
# ci / toolchain-only PRs.

name: Documentation

on:
  workflow_call:
    inputs:
      submatrix:
        description: 'JSON-encoded releases submatrix from cpp-matrix'
        type: string
        required: true
      use-develop-binaries:
        description: 'true to fetch packages from develop-release instead of this run'
        type: boolean
        default: false

jobs:
  documentation:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.submatrix) }}

    defaults:
      run:
        shell: bash

    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    permissions:
      contents: read
    steps:
      - name: Container Bootstrap
        uses: alandefreitas/cpp-actions/container-bootstrap@v1.9.5

      # Adds the apt source that publishes the release GCC for ubuntu:20.04, so that Setup C++ finds it.
      - name: Add The Release GCC Source
        if: ${{ matrix.container == 'ubuntu:20.04' }}
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl
          mkdir -p /etc/apt/keyrings
          curl -fsSL 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x60C317803A41BA51845E371A1E9377A2BA9EF27F' \
            -o /etc/apt/keyrings/ubuntu-toolchain-r-test.asc
          echo 'deb [signed-by=/etc/apt/keyrings/ubuntu-toolchain-r-test.asc] https://ppa.launchpadcontent.net/ubuntu-toolchain-r/test/ubuntu focal main' \
            > /etc/apt/sources.list.d/ubuntu-toolchain-r-test.list

      - name: Setup C++
        uses: alandefreitas/cpp-actions/setup-cpp@v1.9.5
        id: setup-cpp
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}

      - name: Install packages
        uses: alandefreitas/cpp-actions/package-install@v1.9.5
        with:
          apt-get: build-essential asciidoctor cmake bzip2 git rsync

      - name: Clone MrDocs
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # ubuntu:20.04 has Python 3.8, and the scripts need 3.9.
      - name: Setup Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
          activate-environment: true
          enable-cache: false

      - name: Setup CMake
        uses: alandefreitas/cpp-actions/setup-cmake@v1.9.5
        with:
          version: '>=3.26'

      # Same dual-source pattern as ci-releases.yml: fresh-build artifact
      # when we built this run, develop-release fallback otherwise.
      - name: Download MrDocs package (fresh build)
        if: ${{ !inputs.use-develop-binaries }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.mrdocs-release-package-artifact }}
          path: packages

      - name: Download MrDocs package (develop-release fallback)
        if: ${{ inputs.use-develop-binaries }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p packages
          case "${{ runner.os }}" in
            Linux)   pattern='*Linux*' ;;
            Windows) pattern='*Windows*' ;;
            macOS)   pattern='*Darwin*' ;;
            *) echo "::error::unknown runner.os: ${{ runner.os }}"; exit 1 ;;
          esac
          gh release download develop-release --pattern "$pattern" -D packages

      - name: Install MrDocs from Package
        run: .github/scripts/install-mrdocs-package.sh

      - name: Generate Landing Page
        working-directory: docs/website
        run: |
          npm ci
          node render.js
          mkdir -p ../../build/website
          cp index.html ../../build/website/index.html
          cp robots.txt ../../build/website/robots.txt
          cp styles.css ../../build/website/styles.css
          cp -r assets ../../build/website/assets

      - name: Generate Antora UI
        working-directory: docs/ui
        run: |
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          export GH_TOKEN
          npm ci
          npx gulp lint
          npx gulp

      # Generates the documentation site with Antora.
      - name: Generate Local Documentation
        working-directory: docs
        env:
          CC: ${{ steps.setup-cpp.outputs.cc || matrix.cc }}
          CXX: ${{ steps.setup-cpp.outputs.cxx || matrix.cxx }}
        run: |
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          export GH_TOKEN
          set -x
          # The C++ reference extension searches PATH for g++ before it reads
          # CXX, so put the selected GCC's g++ and gcc first.
          # https://github.com/cppalliance/antora-cpp-reference-extension/issues/2
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            shim="$RUNNER_TEMP/compiler-shim"
            mkdir -p "$shim"
            ln -sf "$(command -v "$CC")" "$shim/gcc"
            ln -sf "$(command -v "$CXX")" "$shim/g++"
            export PATH="$shim:$PATH"
          fi
          npm ci
          npx antora antora-playbook.yml --attribute branchesarray=HEAD --stacktrace --log-level=debug
          mkdir -p ../build/docs-local
          cp -vr build/site/* ../build/docs-local

      - name: Upload Website as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Website ${{ runner.os }}
          path: build/website
          retention-days: 30
