name: Build & Test

on:
  workflow_call:
    inputs:
      matrix:
        description: 'JSON-encoded build matrix from cpp-matrix'
        type: string
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}

    defaults:
      run:
        shell: bash

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    env: ${{ matrix.env }}
    steps:
      - name: Container Bootstrap
        uses: alandefreitas/cpp-actions/container-bootstrap@v1.9.5

      - name: Setup C++
        uses: alandefreitas/cpp-actions/setup-cpp@v1.9.5
        id: setup-cpp
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}

      - name: Install System Packages
        uses: alandefreitas/cpp-actions/package-install@v1.9.5
        id: package-install
        with:
          packages: ${{ matrix.install }}
          apt-get-source-keys: ${{ matrix.coverage && 'https://apt.llvm.org/llvm-snapshot.gpg.key' || '' }}
          apt-get-sources: ${{ matrix.coverage && 'deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' || '' }}

      - name: Clone MrDocs
        uses: actions/checkout@v6

      - name: Restore LLVM Cache
        id: llvm-cache
        uses: actions/cache/restore@v5
        with:
          path: build/third-party/install/llvm
          key: ${{ matrix.llvm-cache-key }}

      # Install third-party deps (LLVM, JerryScript, Lua, Boost, libxml2).
      # --skip-build: only install deps, the MrDocs build is done by cmake-workflow.
      # --cache-dir: flatten install paths to <dir>/<lib> for stable cache keys.
      # --env-file: write _ROOT paths so we can inject them into GITHUB_ENV.
      # Bootstrap writes BOOTSTRAP_REBUILT=<list> when it rebuilds any recipe.
      - name: Bootstrap Dependencies
        run: |
          python3 bootstrap.py --yes \
            --skip-build --no-run-configs \
            --build-type "${{ matrix.build-type }}" \
            --cc "${{ steps.setup-cpp.outputs.cc || matrix.cc }}" \
            --cxx "${{ steps.setup-cpp.outputs.cxx || matrix.cxx }}" \
            --cache-dir build/third-party/install \
            --env-file "$RUNNER_TEMP/bootstrap-env.txt" \
            ${{ matrix.bootstrap-sanitizer && format('--sanitizer {0}', matrix.bootstrap-sanitizer) || '' }} \
            ${{ matrix.common-ccflags && format('--cflags="{0}" --cxxflags="{0}"', matrix.common-ccflags) || '' }}
          cat "$RUNNER_TEMP/bootstrap-env.txt" >> "$GITHUB_ENV"

      # Save the LLVM cache when bootstrap rebuilt it (cache miss or
      # stale stamp). BOOTSTRAP_REBUILT lists rebuilt recipes.
      #
      # `actions:write` (needed for the DELETE call below) is only granted
      # to workflows on the base repo, so fork PRs get a read-only token
      # and can't delete or overwrite the base-branch cache anyway.  Skip
      # the whole save path on fork PRs.
      - name: Delete Stale LLVM Cache
        if: |
          contains(env.BOOTSTRAP_REBUILT, 'llvm')
          && steps.llvm-cache.outputs.cache-hit == 'true'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/caches?key=${{ matrix.llvm-cache-key }}")
          case "$code" in
            200) echo "Deleted old cache for key ${{ matrix.llvm-cache-key }}" ;;
            404) echo "No existing cache for key ${{ matrix.llvm-cache-key }}" ;;
            403) echo "::warning::Skipping cache delete: token lacks actions:write (HTTP 403)" ;;
            *)   echo "::error::Failed to delete cache (HTTP $code)"; exit 1 ;;
          esac

      - name: Save Updated LLVM Cache
        if: |
          contains(env.BOOTSTRAP_REBUILT, 'llvm')
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@v5
        with:
          path: build/third-party/install/llvm
          key: ${{ matrix.llvm-cache-key }}

      - name: CMake Workflow
        uses: alandefreitas/cpp-actions/cmake-workflow@v1.9.5
        with:
          cmake-version: '>=3.26'
          cxxstd: ${{ matrix.cxxstd }}
          cc: ${{ steps.setup-cpp.outputs.cc || matrix.cc }}
          ccflags: ${{ matrix.ccflags }}
          cxx: ${{ steps.setup-cpp.outputs.cxx || matrix.cxx }}
          cxxflags: ${{ matrix.cxxflags }} ${{ env.BOOTSTRAP_CXXFLAGS }}
          ldflags: ${{ env.BOOTSTRAP_LDFLAGS }}
          generator: Ninja
          build-type: ${{ matrix.build-type }}
          install-prefix: .local
          export-compile-commands: true
          run-tests: true
          install: true
          package: ${{ matrix.is-main }}
          package-dir: packages
          package-generators: ${{ matrix.mrdocs-package-generators }}
          package-artifact: false
          ctest-timeout: 9000

      # Upload packages for ci-releases.yml to pick up
      - name: Upload GitHub Release Artifacts
        if: matrix.is-release-build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.mrdocs-release-package-artifact }}
          path: |
            build/packages
            !build/packages/_CPack_Packages
          retention-days: 1

      - name: FlameGraph
        uses: alandefreitas/cpp-actions/flamegraph@v1.9.5
        if: matrix.time-trace
        with:
          build-dir: build
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Process Coverage
        id: process-coverage
        if: matrix.coverage
        uses: alandefreitas/cpp-actions/process-coverage@v1.9.5
        with:
          cxx: ${{ steps.setup-cpp.outputs.cxx || matrix.cxx }}
          build-dir: build
          html-report: true
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          codecov-flags: cpp

      # Save the produced LCOV report so PRs that don't change source files
      # can replay it to codecov without re-running a Coverage build.
      # `ci-scope-detector.yml` probes this artifact by name and merge-base SHA.
      - name: Save coverage for replay
        if: |
          matrix.coverage &&
          github.event_name == 'push' &&
          github.ref_name == 'develop' &&
          steps.process-coverage.outputs.lcov-file != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-develop
          path: ${{ steps.process-coverage.outputs.lcov-file }}
          retention-days: 90
          if-no-files-found: error
