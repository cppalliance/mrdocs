name: Build & Test

on:
  workflow_call:
    inputs:
      matrix:
        description: 'JSON-encoded build matrix from cpp-matrix'
        type: string
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}

    defaults:
      run:
        shell: bash

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    env: ${{ matrix.env }}
    steps:
      - name: Container Bootstrap
        uses: alandefreitas/cpp-actions/container-bootstrap@v1.9.5

      # Adds the apt source that publishes the release GCC for ubuntu:20.04, so that Setup C++ finds it.
      - name: Add The Release GCC Source
        if: ${{ matrix.container == 'ubuntu:20.04' }}
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl
          mkdir -p /etc/apt/keyrings
          curl -fsSL 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x60C317803A41BA51845E371A1E9377A2BA9EF27F' \
            -o /etc/apt/keyrings/ubuntu-toolchain-r-test.asc
          echo 'deb [signed-by=/etc/apt/keyrings/ubuntu-toolchain-r-test.asc] https://ppa.launchpadcontent.net/ubuntu-toolchain-r/test/ubuntu focal main' \
            > /etc/apt/sources.list.d/ubuntu-toolchain-r-test.list

      - name: Setup C++
        uses: alandefreitas/cpp-actions/setup-cpp@v1.9.5
        id: setup-cpp
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}

      - name: Install System Packages
        uses: alandefreitas/cpp-actions/package-install@v1.9.5
        id: package-install
        with:
          packages: ${{ matrix.install }}
          apt-get-source-keys: ${{ matrix.coverage && 'https://apt.llvm.org/llvm-snapshot.gpg.key' || '' }}
          apt-get-sources: ${{ matrix.coverage && 'deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' || '' }}

      - name: Clone MrDocs
        uses: actions/checkout@v6

      - name: Fetch the nearest release tag
        # A push build labels itself with the nearest calendar tag, which a depth-1 clone lacks.
        if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}
        uses: ./.github/actions/fetch-release-tag

      # ubuntu:20.04 has Python 3.8, and the scripts need 3.9.
      - name: Setup Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
          activate-environment: true
          enable-cache: false

      - name: Setup CMake
        uses: alandefreitas/cpp-actions/setup-cmake@v1.9.5
        with:
          version: '>=3.26'

      # clang and CMake both read MACOSX_DEPLOYMENT_TARGET, so bootstrap.py and
      # the cmake-workflow builds below build for the same macOS as the release.
      - name: Set The macOS Deployment Target
        if: ${{ matrix.macos-deployment-target != '' }}
        run: echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos-deployment-target }}" >> "$GITHUB_ENV"

      - name: Restore LLVM Cache
        id: llvm-cache
        uses: actions/cache/restore@v5
        with:
          path: build/third-party/install/llvm
          key: ${{ matrix.llvm-cache-key }}

      # Install third-party deps (LLVM, JerryScript, Lua, Boost, libxml2).
      # --skip-build: only install deps, the MrDocs build is done by cmake-workflow.
      # --cache-dir: flatten install paths to <dir>/<lib> for stable cache keys.
      # --env-file: write _ROOT paths so we can inject them into GITHUB_ENV.
      # Bootstrap writes BOOTSTRAP_REBUILT=<list> when it rebuilds any recipe.
      - name: Bootstrap Dependencies
        run: |
          python3 bootstrap.py --yes \
            --skip-build --no-run-configs \
            --build-type "${{ matrix.build-type }}" \
            --cc "${{ steps.setup-cpp.outputs.cc || matrix.cc }}" \
            --cxx "${{ steps.setup-cpp.outputs.cxx || matrix.cxx }}" \
            --cache-dir build/third-party/install \
            --env-file "$RUNNER_TEMP/bootstrap-env.txt" \
            ${{ matrix.bootstrap-sanitizer && format('--sanitizer {0}', matrix.bootstrap-sanitizer) || '' }} \
            ${{ matrix.common-ccflags && format('--cflags="{0}" --cxxflags="{0}"', matrix.common-ccflags) || '' }}
          cat "$RUNNER_TEMP/bootstrap-env.txt" >> "$GITHUB_ENV"
          # mrdocs install prefix, reused for the install and the consumer test
          echo "MRDOCS_PREFIX=${GITHUB_WORKSPACE//\\//}/.local" >> "$GITHUB_ENV"

      # Save the LLVM cache when bootstrap rebuilt it (cache miss or
      # stale stamp). BOOTSTRAP_REBUILT lists rebuilt recipes.
      #
      # Only runs on develop do this. GitHub scopes a cache entry to the ref
      # that saved it, and a run can only read entries from its own ref, a
      # PR's base ref, and the default branch. develop is the default branch,
      # so an entry saved here is the one every PR, merge-queue run, master
      # run, and tag run can read. An entry saved from master, a tag, or a
      # PR is visible to that ref alone and only eats cache quota, while a
      # key-wide delete from such a run would remove the shared entry and
      # give nothing back in its place (master is always a fast-forward of
      # develop, so it never has anything develop lacks). `actions/cache/save`
      # cannot overwrite an existing key, hence the explicit delete first;
      # the `ref` filter limits even that to develop's own entry.
      - name: Delete Stale LLVM Cache
        if: |
          contains(env.BOOTSTRAP_REBUILT, 'llvm')
          && steps.llvm-cache.outputs.cache-hit == 'true'
          && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/caches?key=${{ matrix.llvm-cache-key }}&ref=refs/heads/develop")
          case "$code" in
            200) echo "Deleted old cache for key ${{ matrix.llvm-cache-key }}" ;;
            404) echo "No existing cache for key ${{ matrix.llvm-cache-key }}" ;;
            403) echo "::warning::Skipping cache delete: token lacks actions:write (HTTP 403)" ;;
            *)   echo "::error::Failed to delete cache (HTTP $code)"; exit 1 ;;
          esac

      - name: Save Updated LLVM Cache
        if: |
          contains(env.BOOTSTRAP_REBUILT, 'llvm')
          && github.ref == 'refs/heads/develop'
        uses: actions/cache/save@v5
        with:
          path: build/third-party/install/llvm
          key: ${{ matrix.llvm-cache-key }}

      # Configures, builds, tests and installs MrDocs.
      - name: CMake Workflow
        uses: alandefreitas/cpp-actions/cmake-workflow@v1.9.5
        env:
          # The CMake that mrdocs-self-doc starts reads CC and CXX.
          CC: ${{ steps.setup-cpp.outputs.cc || matrix.cc }}
          CXX: ${{ steps.setup-cpp.outputs.cxx || matrix.cxx }}
        with:
          cmake-version: '>=3.26'
          cxxstd: ${{ matrix.cxxstd }}
          cc: ${{ steps.setup-cpp.outputs.cc || matrix.cc }}
          ccflags: ${{ matrix.ccflags }}
          cxx: ${{ steps.setup-cpp.outputs.cxx || matrix.cxx }}
          cxxflags: ${{ matrix.cxxflags }} ${{ env.BOOTSTRAP_CXXFLAGS }}
          ldflags: ${{ env.BOOTSTRAP_LDFLAGS }}
          generator: Ninja
          build-dir: build/mrdocs
          build-type: ${{ matrix.build-type }}
          install-prefix: ${{ env.MRDOCS_PREFIX }}
          export-compile-commands: true
          run-tests: true
          install: true
          extra-args: ${{ matrix.mrdocs-linux-release == 'true' && '-D MRDOCS_BUNDLE_CXX_RUNTIME=ON' || '' }} ${{ matrix.macos-deployment-target != '' && format('-D CMAKE_OSX_DEPLOYMENT_TARGET={0}', matrix.macos-deployment-target) || '' }} ${{ matrix.shared && '-D MRDOCS_BUILD_SHARED=ON' || '' }}
          package: ${{ matrix.is-release-build == 'true' }}
          package-dir: ../packages
          package-generators: ${{ matrix.mrdocs-package-generators }}
          package-artifact: false
          ctest-timeout: 9000

      # Checks that MRDOCS_BUILD_SHARED took effect, since CMake only warns
      # about an unknown -D name.
      - name: Shared row builds a shared core
        if: ${{ matrix.shared }}
        run: |
          ninja -C build/mrdocs -t targets all | grep -E '^src/(lib)?mrdocs-core\.(so|dylib|dll):'

      # Consumes the installed MrDocs from an out-of-tree project
      # (tests/integration/cmake): find_package(mrdocs), then run the installed
      # binary (executable/), build and load a plugin (plugin/), and link
      # mrdocs::mrdocs-core (library/). It is the only coverage of MrDocs as a
      # library, so it runs on every platform.
      - name: CMake Consumer Test (cmake test)
        # Sanitizer and coverage builds use instrumented toolchains that a
        # consumer would have to mirror.
        if: ${{ !matrix.coverage && !matrix.bootstrap-sanitizer }}
        uses: alandefreitas/cpp-actions/cmake-workflow@v1.9.5
        with:
          cmake-version: '>=3.26'
          source-dir: tests/integration/cmake
          build-dir: build/cmake-consumer
          cxxstd: ${{ matrix.cxxstd }}
          cc: ${{ steps.setup-cpp.outputs.cc || matrix.cc }}
          cxx: ${{ steps.setup-cpp.outputs.cxx || matrix.cxx }}
          # Only the ABI flags MrDocs was built with, not its -Werror/-WX flags.
          cxxflags: ${{ env.BOOTSTRAP_CXXFLAGS }}
          ldflags: ${{ env.BOOTSTRAP_LDFLAGS }}
          generator: Ninja
          build-type: ${{ matrix.build-type }}
          # mrdocs_ROOT, rather than CMAKE_PREFIX_PATH, exercises the
          # package-specific search path.
          extra-args: -D mrdocs_ROOT=${{ env.MRDOCS_PREFIX }}
          run-tests: true
          install: false

      - name: CMake Consumer Test (library example)
        if: ${{ !matrix.coverage && !matrix.bootstrap-sanitizer }}
        uses: alandefreitas/cpp-actions/cmake-workflow@v1.9.5
        with:
          cmake-version: '>=3.26'
          source-dir: examples/library/breaking-changes
          build-dir: build/example-breaking-changes
          cxxstd: ${{ matrix.cxxstd }}
          cc: ${{ steps.setup-cpp.outputs.cc || matrix.cc }}
          cxx: ${{ steps.setup-cpp.outputs.cxx || matrix.cxx }}
          cxxflags: ${{ env.BOOTSTRAP_CXXFLAGS }}
          ldflags: ${{ env.BOOTSTRAP_LDFLAGS }}
          generator: Ninja
          build-type: ${{ matrix.build-type }}
          extra-args: -D mrdocs_ROOT=${{ env.MRDOCS_PREFIX }}
          run-tests: true
          install: false

      # Upload packages for ci-releases.yml to pick up
      - name: Upload GitHub Release Artifacts
        if: matrix.is-release-build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.mrdocs-release-package-artifact }}
          path: |
            build/packages
            !build/packages/_CPack_Packages
          retention-days: 1

      - name: FlameGraph
        uses: alandefreitas/cpp-actions/flamegraph@v1.9.5
        if: matrix.time-trace
        with:
          build-dir: build/mrdocs
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Process Coverage
        id: process-coverage
        if: matrix.coverage
        uses: alandefreitas/cpp-actions/process-coverage@v1.9.5
        with:
          cxx: ${{ steps.setup-cpp.outputs.cxx || matrix.cxx }}
          build-dir: build/mrdocs
          html-report: true
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          codecov-flags: cpp

      # Save the produced LCOV report so PRs that don't change source files
      # can replay it to codecov without re-running a Coverage build.
      # `ci-scope-detector.yml` probes this artifact by name and merge-base SHA.
      - name: Save coverage for replay
        if: |
          matrix.coverage &&
          github.event_name == 'push' &&
          github.ref_name == 'develop' &&
          steps.process-coverage.outputs.lcov-file != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-develop
          path: ${{ steps.process-coverage.outputs.lcov-file }}
          retention-days: 90
          if-no-files-found: error
