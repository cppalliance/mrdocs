#
# Always-run aggregator and (conditionally) the publisher. The first step
# checks every upstream job's result and fails if any failed or were
# cancelled; the remaining publishing steps are gated on `should-publish`
# so the job is cheap on PRs and only renders/publishes on push events to
# develop, master, or tags. This job is the single required status check
# the branch protection rules rely on.

name: Publish

on:
  workflow_call:
    inputs:
      submatrix:
        description: 'JSON-encoded releases submatrix from cpp-matrix (for platform names)'
        type: string
        required: true
      should-publish:
        description: 'true on push to develop/master/tags; gates the actual publishing steps'
        type: boolean
        default: false
      scope-detector-result:
        type: string
        required: true
      cpp-matrix-result:
        type: string
        required: true
      utility-tests-result:
        type: string
        required: true
      build-result:
        type: string
        required: true
      releases-result:
        type: string
        required: true
      documentation-result:
        type: string
        required: true

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # `gh workflow run` in "Cut calendar release" below.
      actions: write
    steps:
      # Aggregator: succeed only if every upstream job ended in success or
      # skipped. Failure or cancellation fails this job so the branch
      # protection gate fails too.
      - name: Check upstream status
        env:
          SCOPE_DETECTOR: ${{ inputs.scope-detector-result }}
          CPP_MATRIX: ${{ inputs.cpp-matrix-result }}
          UTILITY_TESTS: ${{ inputs.utility-tests-result }}
          BUILD: ${{ inputs.build-result }}
          RELEASES: ${{ inputs.releases-result }}
          DOCUMENTATION: ${{ inputs.documentation-result }}
        run: |
          set -euo pipefail
          fail=0
          for name in SCOPE_DETECTOR CPP_MATRIX UTILITY_TESTS BUILD RELEASES DOCUMENTATION; do
            val="${!name}"
            case "$val" in
              success|skipped)
                printf '  %-15s %s\n' "$name" "$val"
                ;;
              *)
                printf '  %-15s %s  <-- failure\n' "$name" "$val"
                fail=1
                ;;
            esac
          done
          if [[ "$fail" -ne 0 ]]; then
            echo "::error::one or more upstream jobs failed or were cancelled"
            exit 1
          fi
          echo "All upstream jobs OK."

      - name: Install packages
        if: inputs.should-publish
        uses: alandefreitas/cpp-actions/package-install@v1.9.5
        with:
          apt-get: rsync git

      - name: Clone MrDocs
        if: inputs.should-publish
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Node.js
        if: inputs.should-publish
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Download all platform packages
        if: inputs.should-publish
        uses: actions/download-artifact@v8
        with:
          pattern: release-packages-*
          path: packages
          merge-multiple: true

      - name: Download website (Linux)
        if: inputs.should-publish
        uses: actions/download-artifact@v8
        with:
          name: Website Linux
          path: build/website

      - name: Download demos (Linux)
        if: inputs.should-publish
        uses: actions/download-artifact@v8
        with:
          name: demos${{ (contains(fromJSON('["master", "develop"]'), github.ref_name) && format('-{0}', github.ref_name)) || '' }}-Linux
          path: .

      - name: Unpack demos
        if: inputs.should-publish
        run: |
          set -euo pipefail
          mkdir -p demos
          # generate-demos.sh writes a bzip2 archive despite the .gz suffix;
          # -xaf auto-detects compression so we don't have to depend on the
          # script keeping the same algorithm.
          tar -xaf demos.tar.gz -C demos

      # First upload: the demos go to the server before the documentation
      # build. The mrdocs-demos macro bakes the gallery table from the live
      # https://mrdocs.com/demos/ listing at docs-build time, so uploading
      # demos afterwards leaves the page one publish behind.
      - name: Publish demos to dev-websites
        if: inputs.should-publish
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          set -euvx
          mkdir -p /home/runner/.ssh
          ssh-keyscan dev-websites.cpp.al >> /home/runner/.ssh/known_hosts
          chmod 600 /home/runner/.ssh/known_hosts
          echo "${{ secrets.DEV_WEBSITES_SSH_KEY }}" > /home/runner/.ssh/github_actions
          chmod 600 /home/runner/.ssh/github_actions
          # ssh-agent outlives the step that starts it, so a leftover socket
          # from an earlier step makes this bind fail with EADDRINUSE.
          rm -f "$SSH_AUTH_SOCK"
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add /home/runner/.ssh/github_actions

          rsyncopts=(--recursive --delete --links --times --chmod=D0755,F0755 --compress --compress-choice=zstd --rsh="ssh -o StrictHostKeyChecking=no" --human-readable)
          demo_dir="ubuntu@dev-websites.cpp.al:/var/www/mrdox.com/demos/${{ github.ref_name }}"
          time rsync "${rsyncopts[@]}" $(pwd)/demos/ "$demo_dir"/

      - name: Ensure all refs for Antora
        if: inputs.should-publish
        run: |
          set -euo pipefail
          # Make sure Antora sees every branch and tag from the upstream repo,
          # regardless of who triggered the workflow.
          git remote set-url origin https://github.com/cppalliance/mrdocs.git
          git fetch --prune --prune-tags origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'

      # Antora's playbook references `./ui/build/ui-bundle.zip` (relative to
      # docs/), so we need the gulp-built bundle in this runner. We could pass
      # it as an artifact from Documentation/Linux, but rebuilding here is
      # cheap and keeps Publish self-contained.
      - name: Generate Antora UI
        if: inputs.should-publish
        working-directory: docs/ui
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npx gulp

      - name: Generate Remote Documentation
        if: inputs.should-publish
        working-directory: docs
        run: |
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          export GH_TOKEN
          set -x
          npm ci
          npx antora --clean --fetch antora-playbook.yml --log-level=debug
          mkdir -p ../build/website/docs
          cp -vr build/site/* ../build/website/docs

      - name: Download previous demos (tags only)
        if: inputs.should-publish && startsWith(github.ref, 'refs/tags/')
        id: download-prev-demos
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: demos-develop-Linux
          path: demos-previous

      - name: Compare demos (tags only)
        if: inputs.should-publish && startsWith(github.ref, 'refs/tags/') && steps.download-prev-demos.outputs.cache-hit == 'true'
        id: compare-demos
        run: .github/scripts/compare-demos.sh

      - name: Upload demo diff (tags only)
        if: inputs.should-publish && startsWith(github.ref, 'refs/tags/') && steps.compare-demos.outputs.diff == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: demos-diff
          path: demos-diff
          retention-days: 30

      - name: Publish website to GitHub Pages
        if: inputs.should-publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/website
          force_orphan: true

      - name: Publish website to dev-websites
        if: inputs.should-publish
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          set -euvx
          mkdir -p /home/runner/.ssh
          ssh-keyscan dev-websites.cpp.al >> /home/runner/.ssh/known_hosts
          chmod 600 /home/runner/.ssh/known_hosts
          echo "${{ secrets.DEV_WEBSITES_SSH_KEY }}" > /home/runner/.ssh/github_actions
          chmod 600 /home/runner/.ssh/github_actions
          # The "Publish demos to dev-websites" agent is still bound to this
          # socket, so drop the stale path before starting a new agent.
          rm -f "$SSH_AUTH_SOCK"
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add /home/runner/.ssh/github_actions

          rsyncopts=(--recursive --delete --links --times --chmod=D0755,F0755 --compress --compress-choice=zstd --rsh="ssh -o StrictHostKeyChecking=no" --human-readable)
          website_dir="ubuntu@dev-websites.cpp.al:/var/www/mrdox.com"

          # Second upload: the demos went up before the documentation build
          # (see "Publish demos to dev-websites" above).
          time rsync "${rsyncopts[@]}" --exclude=demos/ $(pwd)/build/website/ "$website_dir"/

      # Both SemVer tags (v0.8.0) and calendar release tags (2026.9.2,
      # 2026.9.2+1) delimit the changelog, so each calendar release lists the
      # commits since the previous one rather than since the last SemVer tag.
      - name: Create changelog
        if: inputs.should-publish
        uses: alandefreitas/cpp-actions/create-changelog@v1.9.5
        with:
          output-path: CHANGELOG.md
          thank-non-regular: ${{ startsWith(github.ref, 'refs/tags/') }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag-pattern: '^(v\d+\.\d+\.\d+|20\d\d\.\d{1,2}\.\d{1,2}(\+\d+)?)$'
          limit: 150
          update-summary: true

      # CPack names packages after the project version (MrDocs-0.8.0-*).
      # Only SemVer tag releases keep that name. Rolling branch releases
      # (develop-release, master-release) get the branch name instead, so
      # subsequent pushes overwrite the existing GitHub-release assets
      # cleanly, and calendar releases get their release label
      # (MrDocs-2026.9.2-*) so downloads say which release they are.
      - name: Rebrand branch and calendar-release packages
        if: inputs.should-publish && !startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euxo pipefail
          cd packages
          for f in MrDocs-*.*.*-*.*; do
            [ -e "$f" ] || continue
            new=$(echo "$f" | sed -E 's|^MrDocs-[0-9]+\.[0-9]+\.[0-9]+-|MrDocs-${{ github.ref_name }}-|')
            mv -- "$f" "$new"
          done

      - name: Create consolidated GitHub Release
        if: inputs.should-publish
        uses: softprops/action-gh-release@v3
        with:
          files: packages/MrDocs-*-*.*
          fail_on_unmatched_files: true
          name: ${{ github.ref_name || github.ref }}
          tag_name: ${{ github.ref_name || github.ref }}${{ ((!startsWith(github.ref, 'refs/tags/')) && '-release') || '' }}
          body_path: CHANGELOG.md
          prerelease: false
          draft: false
          # Tag releases (SemVer or calendar) become the "Latest" release
          # users land on; the rolling branch releases never do.
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
          token: ${{ github.token }}

      # Every push to master is a calendar release. The label is the UTC
      # commit date of the master commit (YYYY.M.D, no zero padding so it is
      # valid semver for the tools that parse it); a second release on the
      # same day appends semver build metadata (+1, +2, ...). The project
      # version in CMake is untouched: the release label lives in the tag,
      # the release name, the package filenames, and `mrdocs --version`.
      #
      # A tag pushed with GITHUB_TOKEN does not start a workflow run on its
      # own, so the tag build is started explicitly through workflow_dispatch
      # (which that token may trigger). The dispatched run then takes the
      # normal tag path in this job and creates the GitHub Release.
      - name: Cut calendar release (master only)
        if: inputs.should-publish && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_re='^20[0-9]{2}\.[0-9]{1,2}\.[0-9]{1,2}(\+[0-9]+)?$'
          if git tag --points-at HEAD | grep -Eq "$release_re"; then
            echo "HEAD already carries a calendar release tag; nothing to cut."
            exit 0
          fi
          label=$(date -u -d "@$(git log -1 --format=%ct HEAD)" '+%Y.%-m.%-d')
          candidate="$label"
          n=1
          while git ls-remote --exit-code --tags origin "refs/tags/$candidate" >/dev/null 2>&1; do
            candidate="$label+$n"
            n=$((n + 1))
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$candidate" -m "MrDocs release $candidate"
          git push origin "refs/tags/$candidate"
          echo "Pushed calendar release tag $candidate"
          # The tag can take a moment to become visible to the API.
          for attempt in 1 2 3 4 5; do
            if gh workflow run ci.yml --ref "$candidate"; then
              echo "Started the release build for $candidate"
              exit 0
            fi
            echo "gh workflow run failed (attempt $attempt); retrying..."
            sleep 10
          done
          echo "::error::could not start the release build for $candidate"
          exit 1
