# Codecov Configuration
# https://docs.codecov.com/docs/codecovyml-reference
#
# Two coverage streams are uploaded separately:
#   - "cpp" flag: C++ source and tests from the clang coverage build
#   - "bootstrap" flag: Python bootstrap code and tests from utility-tests
#
# Each has its own project and patch targets so they don't
# interfere with each other.

coverage:
  status:
    project:
      default:
        flags: [cpp]
        threshold: 1%
      bootstrap:
        flags: [bootstrap]
        threshold: 1%
    patch:
      default:
        flags: [cpp]
        target: 90%
      bootstrap:
        flags: [bootstrap]
        target: 80%

flags:
  cpp:
    paths:
      - "!utils/bootstrap/**"
    carryforward: true
  bootstrap:
    paths:
      - utils/bootstrap/
    carryforward: true
