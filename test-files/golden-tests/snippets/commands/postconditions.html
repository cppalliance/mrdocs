<h2 id="sort_buffer">
sort_buffer</h2>
<div>
<p>Sorts the elements of <code>buffer</code> in ascending order.</p>
</div>
</div>
<div>
<h3>
Synopsis</h3>
<div>
Declared in <code>&lt;postconditions.cpp&gt;</code></div>
<pre><code class="source-code cpp">void
sort_buffer(
    int* buffer,
    unsigned int n);</code></pre>
</div>
<div>
<h3>
Postconditions</h3>
<ul>
<li>For every index i in [0, n - 1),] <code>buffer[i]&lt;&#x3D; buffer[i + 1]</code>.</li>
</ul>
